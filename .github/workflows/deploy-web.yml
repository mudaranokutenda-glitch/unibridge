# Builds the web version of UniBridge and publishes it on GitHub Pages:
#   https://mudaranokutenda-glitch.github.io/unibridge/
# Runs on every push to the branches below, or by hand (Actions tab > Run workflow).
# One-time set-up: repo Settings > Pages > Source = "GitHub Actions".
# No secret is needed: the Supabase anon key in lib/config.dart is public by design.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main, pending-builds-2, fix/onboarding]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels the older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # /unibridge/ = the repository name (GitHub Pages address).
      - run: flutter build web --release --base-href /unibridge/

      # Opening any address of the site shows the app (no GitHub 404 page).
      - run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
