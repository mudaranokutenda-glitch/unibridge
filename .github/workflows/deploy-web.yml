# Builds the web version of UniBridge and puts it in the "gh-pages" branch.
# GitHub Pages shows that branch at:
#   https://mudaranokutenda-glitch.github.io/unibridge/
# Runs on every push to the branches below, or by hand (Actions tab > Run workflow).
#
# One-time set-up (after the first green run):
#   repo Settings > Pages > Source = "Deploy from a branch" > gh-pages / (root)
# No environment rules and no secret are needed (GITHUB_TOKEN is automatic,
# the Supabase anon key in lib/config.dart is public by design).
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main, pending-builds-2, fix/onboarding]
  workflow_dispatch:

permissions:
  contents: write # to update the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # /unibridge/ = the repository name (GitHub Pages address).
      - run: flutter build web --release --base-href /unibridge/

      # Opening any address of the site shows the app (no GitHub 404 page).
      - run: cp build/web/index.html build/web/404.html
      # Tell GitHub not to process the files (keeps folders that start with _).
      - run: touch build/web/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Web build from ${{ github.ref_name }}"
