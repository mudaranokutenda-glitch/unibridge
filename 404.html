<!DOCTYPE html>
<html>
<head>
  <!-- Replaced by the value of --base-href (GitHub Pages: /unibridge/). -->
  <base href="/unibridge/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="UniBridge - exchange, marketplace and student space for Zimbabwean students in Algeria.">
  <meta name="theme-color" content="#2F80ED">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UniBridge">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>UniBridge</title>
  <link rel="manifest" href="manifest.json">

  <!-- Sky blue while the app loads (same as the Android start screen). -->
  <style>
    html, body { margin: 0; height: 100%; background: #2F80ED; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; color: #ffffff;
      font: 800 30px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <div id="loading">UniBridge</div>
  <script>
    // Hide "UniBridge" once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
